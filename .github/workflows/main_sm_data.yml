name: Sports Data By SM

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Python Script
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          cp private_code/App/sports_ap_sm.py .
          rm -rf private_code

      - name: Run Sports Scraper
        run: python sports_ap_sm.py > Sports_data.json

      - name: Remove Python Script
        run: rm -f sports_ap_sm.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sports_data.json
          git diff --cached --quiet || git commit -m "Update Sports data"
          git push
