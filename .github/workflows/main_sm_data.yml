name: Sports Data By SM

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: sm-monirulislam/${{ secrets.SECRET_REPO_NAME }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Sports Scraper
        run: |
          python App/sports_ap_sm.py > sports_data.json

      - name: Show Generated Data
        run: |
          echo "Generated sports_data.json:"
          ls -lh sports_data.json

      - name: Commit and Push Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sports_data.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "🔁 Update sports data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
