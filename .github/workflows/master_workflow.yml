name: Run All Sports Updates (Main Controller)

on:
  workflow_dispatch:

jobs:

  sports_data1:
    uses: ./.github/workflows/sports_data1.yml
    secrets: inherit

  main_sm_data:
    needs: sports_data1
    if: ${{ always() }}
    uses: ./.github/workflows/sm_main_2nd.yml
    secrets: inherit

  wait_2_minutes:
    needs: main_sm_data
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 2 minutes
        run: sleep 120

  sports_playlist:
    needs: wait_2_minutes
    if: ${{ always() }}
    uses: ./.github/workflows/sports_playlist.yml
    secrets: inherit
