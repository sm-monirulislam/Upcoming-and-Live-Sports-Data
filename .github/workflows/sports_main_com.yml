name: Sports Data By SM

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  merge-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests pycryptodome

      - name: Fetch Python Script
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          cp private_code/App/main_plus_data_sm.py .
          rm -rf private_code

      - name: Run Merge Script
        run: python main_plus_data_sm.py > Sports_data.json

      - name: Remove Python Script
        run: rm -f main_plus_data_sm.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sports_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Sports_data.json"

          git pull --rebase origin main

          git push origin main
