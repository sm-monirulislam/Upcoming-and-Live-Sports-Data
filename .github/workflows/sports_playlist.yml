name: Sports Data Playlist

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install cloudscraper beautifulsoup4 requests pytz Pillow

      - name: Fetch Script
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/sm-monirulislam/$REPO_NAME.git private_code
          mkdir -p App
          cp private_code/App/sports_image.py App/
          rm -rf private_code

      - name: Run Script
        run: python App/sports_image.py

      - name: Clean Up
        run: rm -f App/sports_image.py

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sports_data.m3u match_image/

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update Sports Data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
